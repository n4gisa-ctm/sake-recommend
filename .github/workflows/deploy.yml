name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DEPLOY_TARGET: gh-pages
          VITE_DIFY_API_URL: ${{ secrets.VITE_DIFY_API_URL }}
          VITE_DIFY_API_KEY: ${{ secrets.VITE_DIFY_API_KEY }}
      # dist を gh-pages ブランチへ公開（ブランチ作成時に GitHub Pages が有効化される）
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
